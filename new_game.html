<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Runner Game</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

<!-- 🎯 MENU -->
<div id="menu">

  <h1>Choose Your Character</h1>

  <div class="characters">

    <!-- 🐶 Dog -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" onclick="selectChar(this)">

    <!-- 🐱 Cat -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" onclick="selectChar(this)">

    <!-- 🐶 Dog (duplicate) -->
    <img src="https://cdn-icons-png.flaticon.com/512/236/236831.png" onclick="selectChar(this)">

    <!-- 🐼 Panda -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616494.png" onclick="selectChar(this)">

  </div>

  <button onclick="startGame()">Start Game</button>

</div>

<!-- 🎮 GAME -->
<div class="game" id="game">

  <div id="player"></div>
  <div id="obstacle"></div>

  <h1 id="score">0</h1>

  <!-- 💀 GAME OVER -->
  <div id="gameOver">
    <h1>Game Over 💀</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">Restart</button>
  </div>

</div>

<script src="game.js"></script>

</body>
</html>
